[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos-assistant"
version = "0.1.0"
description = "Single-user Telegram task assistant with natural-language input"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.10.19",
  "pyasn1>=0.6.5",
  "tzdata>=2024.1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.20,<3",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2"]

[project.urls]
Repository = "https://github.com/Yili-code/Chronos"
Documentation = "https://github.com/Yili-code/Chronos/blob/main/README.md"
Issues = "https://github.com/Yili-code/Chronos/issues"

[tool.hatch.build.targets.wheel]
packages = ["chronos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
