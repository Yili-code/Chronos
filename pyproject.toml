[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos-assistant"
version = "0.1.0"
description = "Telegram-first project and task assistant"
requires-python = ">=3.11"
dependencies = [
  "tzdata>=2024.1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["chronos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
