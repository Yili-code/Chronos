[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronos-assistant"
version = "0.1.0"
description = "Single-user Telegram task assistant with natural-language input and a Web dashboard"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.19,<7",
  "tzdata>=2024.1",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.20,<3",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
collector = ["playwright==1.63.0"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.urls]
Repository = "https://github.com/Yili-code/Chronos"
Documentation = "https://github.com/Yili-code/Chronos/blob/main/README.md"
Issues = "https://github.com/Yili-code/Chronos/issues"

[tool.hatch.build.targets.wheel]
packages = ["chronos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
