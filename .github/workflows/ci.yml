name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked --extra dev

      - name: Run tests
        run: uv run python -m pytest -q --junitxml=python-test-results.xml

      - name: Create commit-scoped validation evidence
        if: always()
        run: uv run python scripts/generate_release_evidence.py --junit python-test-results.xml --output release-evidence.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-python-${{ matrix.python-version }}
          path: |
            release-evidence.json
            python-test-results.xml
          if-no-files-found: error
          retention-days: 30

      - name: Verify local demo isolation and task lifecycle
        run: uv run python scripts/check_demo.py

      - name: Check local documentation links
        run: uv run python scripts/check_docs.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Chrome extension tests
        run: node --test chrome-extension/*.test.cjs chrome-extension/*.test.js chrome-extension/test/*.test.js
